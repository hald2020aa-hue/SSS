name: SSS Android Build (APK & Bundle)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_variant:
        description: "نوع النسخة المطلوب بناؤها (debug أو release)"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
          - both

permissions:
  contents: write

jobs:
  build-sss-apk:
    name: Build SSS Neon Manga Reader APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle (from gradle-wrapper.properties)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Materialize debug.keystore from debug.keystore.base64
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Restored debug.keystore from debug.keystore.base64"
          fi

      - name: Ensure .env file exists for Secrets Gradle Plugin
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Build Debug APK (SSS-debug.apk)
        if: ${{ github.event.inputs.build_variant != 'release' }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload SSS Debug APK Artifact
        if: ${{ github.event.inputs.build_variant != 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: SSS-Kotatsu-Neon-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Prepare Release Keystore & Build Release APK
        if: ${{ github.event.inputs.build_variant == 'release' || github.event.inputs.build_variant == 'both' || startsWith(github.ref, 'refs/tags/v') }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            export KEYSTORE_PATH="${GITHUB_WORKSPACE}/my-upload-key.jks"
          else
            echo "Generating fallback release keystore for CI build..."
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass androidrelease \
              -keypass androidrelease \
              -dname "CN=SSS Kotatsu, OU=Mobile, O=SSS, L=Riyadh, S=Riyadh, C=SA"
            export KEYSTORE_PATH="${GITHUB_WORKSPACE}/my-upload-key.jks"
            export STORE_PASSWORD="androidrelease"
            export KEY_PASSWORD="androidrelease"
          fi
          gradle :app:assembleRelease --stacktrace

      - name: Upload SSS Release APK Artifact
        if: ${{ github.event.inputs.build_variant == 'release' || github.event.inputs.build_variant == 'both' || startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: SSS-Kotatsu-Neon-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
